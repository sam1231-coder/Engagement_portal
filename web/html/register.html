<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Account • Humanly - People & Engagement Platform</title>
  <link rel="icon" type="image/svg+xml" href="../assets/humanly-logo.svg" />

    <!-- External Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Core App Stylesheets -->
    <link rel="stylesheet" href="../css/humanly.css" />
    <link rel="stylesheet" href="../css/components.css" />

    <!-- Auth Guard (Redirects to dashboard or admin-dashboard if already logged in) -->
    <script src="../js/auth-guard.js"></script>
  </head>
  <body>
    <!-- Full Viewport Responsive Authentication Screen -->
    <div class="auth-page-root">
      
      <!-- Ambient Blurred Glow Elements (Subtle, Deep, Zero Eye Strain) -->
      <div class="auth-bg-ambient" aria-hidden="true">
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
        <div class="glow-orb glow-orb-3"></div>
      </div>

      <!-- Beautiful Glassmorphism Authentication Card -->
      <div class="auth-glass-card">
        
        <!-- Humanly Brand Header -->
        <div class="auth-glass-brand">
          <div class="auth-glass-icon"><img src="../assets/humanly-logo.svg" alt="Humanly Logo" class="humanly-logo-img" /></div>
          <h2 class="auth-glass-title">Create Account</h2>
          <p class="auth-glass-subtitle">
            Provision a new member profile on the Humanly platform
          </p>
        </div>

        <!-- Registration Form -->
        <form id="registerForm">
          <div class="auth-form-group" style="margin-bottom: 0.95rem;">
            <label class="auth-label" for="regName" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">Full Name</label>
            <input type="text" id="regName" class="glass-input glass-input-plain" required placeholder="e.g. Jordan Smith" />
          </div>

          <div class="auth-form-group" style="margin-bottom: 0.95rem;">
            <label class="auth-label" for="regEmail" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">Work Email Address</label>
            <input type="email" id="regEmail" class="glass-input glass-input-plain" required placeholder="name@humanly.io" />
          </div>

          <div class="auth-form-group" style="margin-bottom: 0.95rem;">
            <label class="auth-label" for="regDepartment" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">Department</label>
            <select id="regDepartment" class="glass-input glass-input-plain">
              <option value="Engineering">Engineering</option>
              <option value="Product & Design">Product & Design</option>
              <option value="People Operations">People Operations</option>
              <option value="Customer Support">Customer Support</option>
              <option value="Marketing & Sales">Marketing & Sales</option>
            </select>
          </div>

          <div class="auth-form-group" style="margin-bottom: 0.95rem;">
            <label class="auth-label" for="regRole" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">Account Access Level</label>
            <select id="regRole" class="glass-input glass-input-plain">
              <option value="employee">Standard Employee (Portal Access)</option>
              <option value="admin">Administrator (Admin Console Access)</option>
            </select>
          </div>

          <div class="auth-form-group" style="margin-bottom: 1.25rem;">
            <label class="auth-label" for="regPassword" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">Create Password</label>
            <input type="password" id="regPassword" class="glass-input glass-input-plain" required placeholder="Minimum 6 characters" />
          </div>

          <div id="regErrorAlert" style="display: none; padding: 0.7rem 0.9rem; background: rgba(185, 28, 28, 0.16); border: 1px solid var(--danger); border-radius: var(--radius-md); color: #fca5a5; font-size: 0.78rem; margin-bottom: 1.15rem;">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="regErrorMsg">Registration failed.</span>
          </div>

          <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.92rem; font-weight: 700; border-radius: var(--radius-md); box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);">
            <i class="fa-solid fa-user-plus"></i> Create Database Account
          </button>

          <!-- Back to Sign In prompt below register form -->
          <div class="auth-switch-prompt" style="margin-top: 1.25rem; padding-top: 1.15rem; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <span class="auth-switch-text" style="font-size: 0.86rem; color: var(--text-secondary);">Already have an account?</span>
            <a href="login.html" class="auth-switch-btn" style="text-decoration: none;">
              <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
            </a>
          </div>
        </form>

        <!-- Security Badge -->
        <div style="text-align: center; margin-top: 1.25rem; font-size: 0.72rem; color: var(--text-muted);">
          <i class="fa-solid fa-shield-halved" style="color: var(--success);"></i> Enterprise Database PBKDF2/SHA-512 Security
        </div>

      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const registerForm = document.getElementById("registerForm");
        const regErrorAlert = document.getElementById("regErrorAlert");
        const regErrorMsg = document.getElementById("regErrorMsg");

        // Initialize Theme from localStorage (defaults to dark mode)
        const savedTheme = localStorage.getItem("humanly_theme") || localStorage.getItem("adminator_theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);

        // Register Submission
        registerForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("regName").value.trim();
          const email = document.getElementById("regEmail").value.trim();
          const department = document.getElementById("regDepartment").value;
          const role = document.getElementById("regRole").value;
          const password = document.getElementById("regPassword").value;
          const submitBtn = document.getElementById("regSubmitBtn");

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';
          regErrorAlert.style.display = "none";

          try {
            await AuthGuard.registerAccount({ name, email, department, role, password });
            App.showToast("Registration Success", `Welcome to Humanly, ${name}!`, "success");
          } catch (err) {
            regErrorAlert.style.display = "block";
            regErrorMsg.textContent = err.message || "Registration failed";
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Database Account';
          }
        });
      });
    </script>
  </body>
</html>
