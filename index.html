<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Humanly - Redirecting...</title>
  <script>
    // Enforce authentication gate on root visit
    const token = localStorage.getItem("humanly_token");
    const isLoggedIn = localStorage.getItem("humanly_logged_in") === "true" && !!token;
    const userStr = localStorage.getItem("humanly_user");
    
    if (isLoggedIn && userStr) {
      try {
        const u = JSON.parse(userStr);
        if (u.role === "admin") {
          window.location.replace("admin-dashboard.html");
        } else {
          window.location.replace("dashboard.html");
        }
      } catch (e) {
        window.location.replace("dashboard.html");
      }
    } else {
      window.location.replace("login.html");
    }
  </script>
  <style>
    body {
      background: #10151d;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loading-box {
      text-align: center;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(37, 99, 235, 0.2);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-box">
    <div class="spinner"></div>
    <p style="font-size: 0.9rem; font-weight: 600; color: #cbd5e1;">Connecting to Humanly Platform...</p>
  </div>
</body>
</html>
