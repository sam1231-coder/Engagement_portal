<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In • Humanly - People & Engagement Platform</title>

    <!-- External Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Core App Stylesheets -->
    <link rel="stylesheet" href="css/humanly.css" />
    <link rel="stylesheet" href="css/components.css" />

    <!-- Auth Guard (Redirects to dashboard or admin-dashboard if already logged in) -->
    <script src="js/auth-guard.js"></script>
  </head>
  <body>
    <!-- Full Viewport Corporate Authentication Screen -->
    <div class="auth-wrapper" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
      <div class="auth-card" style="max-width: 480px; width: 100%; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 2.25rem; box-shadow: var(--shadow-lg);">
        
        <!-- Humanly Brand Header -->
        <div class="auth-brand" style="text-align: center; margin-bottom: 1.75rem;">
          <div class="auth-brand-icon" style="width: 54px; height: 54px; background: var(--primary); color: #ffffff; border-radius: var(--radius-lg); display: inline-flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 0.85rem;">
            <i class="fa-solid fa-users-viewfinder"></i>
          </div>
          <h2 class="auth-title" style="font-size: 1.65rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.35rem;">HUMANLY</h2>
          <p class="auth-subtitle" style="font-size: 0.86rem; color: var(--text-secondary); line-height: 1.4;">
            Enterprise People Analytics, Engagement & Culture Platform
          </p>
        </div>

        <!-- Auth Tabs: Sign In / Create Account -->
        <div style="display: flex; background: var(--bg-subtle); padding: 0.3rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; border: 1px solid var(--border-color);">
          <button id="tabSignInBtn" class="btn btn-sm" style="flex: 1; background: var(--bg-surface); color: var(--text-primary); font-weight: 700; border-radius: var(--radius-sm); border: none; padding: 0.5rem;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
          </button>
          <button id="tabRegisterBtn" class="btn btn-sm" style="flex: 1; background: transparent; color: var(--text-secondary); font-weight: 600; border-radius: var(--radius-sm); border: none; padding: 0.5rem;">
            <i class="fa-solid fa-user-plus"></i> Register
          </button>
        </div>

        <!-- 1. SIGN IN FORM (Queries Database) -->
        <form id="loginForm">
          <div class="auth-form-group" style="margin-bottom: 1.1rem;">
            <label class="auth-label" for="loginEmail" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.4rem;">
              Work Email Address
            </label>
            <div class="auth-input-wrapper" style="position: relative;">
              <i class="fa-regular fa-envelope input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
              <input
                type="email"
                id="loginEmail"
                required
                placeholder="name@humanly.io"
                value="admin@humanly.io"
                style="width: 100%; padding: 0.7rem 1rem 0.7rem 2.5rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.88rem;"
              />
            </div>
          </div>

          <div class="auth-form-group" style="margin-bottom: 1.1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
              <label class="auth-label" for="loginPassword" style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">
                Password
              </label>
              <a href="#" id="forgotPwLink" style="font-size: 0.75rem; color: var(--primary); text-decoration: none;">Forgot password?</a>
            </div>
            <div class="auth-input-wrapper" style="position: relative;">
              <i class="fa-solid fa-lock input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
              <input
                type="password"
                id="loginPassword"
                required
                value="Admin@2026!"
                placeholder="Enter account password"
                style="width: 100%; padding: 0.7rem 2.5rem 0.7rem 2.5rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.88rem;"
              />
              <span id="togglePasswordBtn" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer;">
                <i class="fa-solid fa-eye"></i>
              </span>
            </div>
          </div>

          <div id="loginErrorAlert" style="display: none; padding: 0.65rem 0.85rem; background: rgba(185, 28, 28, 0.15); border: 1px solid var(--danger); border-radius: var(--radius-md); color: #fca5a5; font-size: 0.78rem; margin-bottom: 1.1rem;">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="loginErrorMsg">Invalid credentials.</span>
          </div>

          <button
            type="submit"
            id="loginSubmitBtn"
            class="btn btn-primary"
            style="width: 100%; padding: 0.75rem; font-size: 0.92rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem;"
          >
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Portal
          </button>
        </form>

        <!-- 2. REGISTER FORM (Hidden by default) -->
        <form id="registerForm" style="display: none;">
          <div class="auth-form-group" style="margin-bottom: 0.9rem;">
            <label class="auth-label" for="regName" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">Full Name</label>
            <input type="text" id="regName" required placeholder="e.g. Jordan Smith" style="width: 100%; padding: 0.65rem 1rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.88rem;" />
          </div>

          <div class="auth-form-group" style="margin-bottom: 0.9rem;">
            <label class="auth-label" for="regEmail" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">Work Email</label>
            <input type="email" id="regEmail" required placeholder="name@humanly.io" style="width: 100%; padding: 0.65rem 1rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.88rem;" />
          </div>

          <div class="auth-form-group" style="margin-bottom: 0.9rem;">
            <label class="auth-label" for="regDepartment" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">Department</label>
            <select id="regDepartment" style="width: 100%; padding: 0.65rem 1rem; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.88rem;">
              <option value="Engineering">Engineering</option>
              <option value="Product & Design">Product & Design</option>
              <option value="People Operations">People Operations</option>
              <option value="Customer Support">Customer Support</option>
              <option value="Marketing & Sales">Marketing & Sales</option>
            </select>
          </div>

          <div class="auth-form-group" style="margin-bottom: 0.9rem;">
            <label class="auth-label" for="regRole" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">Account Access Level</label>
            <select id="regRole" style="width: 100%; padding: 0.65rem 1rem; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.88rem;">
              <option value="employee">Standard Employee (Portal Access)</option>
              <option value="admin">Administrator (Admin Console Access)</option>
            </select>
          </div>

          <div class="auth-form-group" style="margin-bottom: 1.1rem;">
            <label class="auth-label" for="regPassword" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.35rem;">Create Password</label>
            <input type="password" id="regPassword" required placeholder="Minimum 6 characters" style="width: 100%; padding: 0.65rem 1rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.88rem;" />
          </div>

          <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.92rem; font-weight: 700;">
            <i class="fa-solid fa-user-plus"></i> Create Database Account
          </button>
        </form>

        <!-- Pre-Seeded Database Accounts Drawer for Quick Testing -->
        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
            <span style="font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">
              <i class="fa-solid fa-database" style="color: var(--primary);"></i> Seeded Database Accounts
            </span>
            <span class="card-badge" style="font-size: 0.65rem;">Click to Fill</span>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
            <!-- Admin Persona Fill -->
            <button
              type="button"
              class="btn btn-sm btn-secondary"
              id="fillAdminBtn"
              style="display: flex; flex-direction: column; align-items: flex-start; padding: 0.5rem 0.65rem; text-align: left; background: var(--bg-subtle);"
            >
              <span style="font-size: 0.75rem; font-weight: 700; color: var(--danger);">
                <i class="fa-solid fa-shield-halved"></i> Administrator
              </span>
              <span style="font-size: 0.68rem; color: var(--text-muted);">admin@humanly.io</span>
            </button>

            <!-- Employee Persona Fill -->
            <button
              type="button"
              class="btn btn-sm btn-secondary"
              id="fillEmpBtn"
              style="display: flex; flex-direction: column; align-items: flex-start; padding: 0.5rem 0.65rem; text-align: left; background: var(--bg-subtle);"
            >
              <span style="font-size: 0.75rem; font-weight: 700; color: var(--primary);">
                <i class="fa-solid fa-user"></i> Employee
              </span>
              <span style="font-size: 0.68rem; color: var(--text-muted);">alex.vance@humanly.io</span>
            </button>
          </div>
        </div>

        <!-- Security Badge -->
        <div style="text-align: center; margin-top: 1.25rem; font-size: 0.72rem; color: var(--text-muted);">
          <i class="fa-solid fa-lock" style="color: var(--success);"></i> Enterprise Database PBKDF2/SHA-512 Hash Verified
        </div>

      </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const tabSignIn = document.getElementById("tabSignInBtn");
        const tabRegister = document.getElementById("tabRegisterBtn");
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const loginErrorAlert = document.getElementById("loginErrorAlert");
        const loginErrorMsg = document.getElementById("loginErrorMsg");

        // Tab Switching
        tabSignIn.addEventListener("click", () => {
          tabSignIn.style.background = "var(--bg-surface)";
          tabSignIn.style.color = "var(--text-primary)";
          tabRegister.style.background = "transparent";
          tabRegister.style.color = "var(--text-secondary)";
          loginForm.style.display = "block";
          registerForm.style.display = "none";
          loginErrorAlert.style.display = "none";
        });

        tabRegister.addEventListener("click", () => {
          tabRegister.style.background = "var(--bg-surface)";
          tabRegister.style.color = "var(--text-primary)";
          tabSignIn.style.background = "transparent";
          tabSignIn.style.color = "var(--text-secondary)";
          registerForm.style.display = "block";
          loginForm.style.display = "none";
          loginErrorAlert.style.display = "none";
        });

        // Seed Fill Buttons
        document.getElementById("fillAdminBtn").addEventListener("click", () => {
          document.getElementById("loginEmail").value = "admin@humanly.io";
          document.getElementById("loginPassword").value = "Admin@2026!";
          App.showToast("Account Autofilled", "Loaded Administrator credentials (admin@humanly.io)", "info");
        });

        document.getElementById("fillEmpBtn").addEventListener("click", () => {
          document.getElementById("loginEmail").value = "alex.vance@humanly.io";
          document.getElementById("loginPassword").value = "Employee@2026!";
          App.showToast("Account Autofilled", "Loaded Employee credentials (alex.vance@humanly.io)", "info");
        });

        // Eye Password Toggle
        const toggleBtn = document.getElementById("togglePasswordBtn");
        const passInput = document.getElementById("loginPassword");
        toggleBtn?.addEventListener("click", () => {
          const isPass = passInput.getAttribute("type") === "password";
          passInput.setAttribute("type", isPass ? "text" : "password");
          toggleBtn.innerHTML = isPass ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
        });

        // Login Submission
        loginForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          const password = document.getElementById("loginPassword").value;
          const submitBtn = document.getElementById("loginSubmitBtn");

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
          loginErrorAlert.style.display = "none";

          try {
            await AuthGuard.loginWithCredentials(email, password);
          } catch (err) {
            loginErrorAlert.style.display = "block";
            loginErrorMsg.textContent = err.message || "Invalid credentials.";
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Portal';
          }
        });

        // Register Submission
        registerForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("regName").value.trim();
          const email = document.getElementById("regEmail").value.trim();
          const department = document.getElementById("regDepartment").value;
          const role = document.getElementById("regRole").value;
          const password = document.getElementById("regPassword").value;
          const submitBtn = document.getElementById("regSubmitBtn");

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

          try {
            await AuthGuard.registerAccount({ name, email, department, role, password });
            App.showToast("Registration Success", `Welcome to Humanly, ${name}!`, "success");
          } catch (err) {
            alert(err.message || "Registration failed");
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Database Account';
          }
        });

        document.getElementById("forgotPwLink").addEventListener("click", (e) => {
          e.preventDefault();
          alert("A temporary reset token has been dispatched to your corporate inbox.");
        });
      });
    </script>
  </body>
</html>
