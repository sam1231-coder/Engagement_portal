<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In • Humanly - People & Engagement Platform</title>

    <!-- External Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Core App Stylesheets -->
    <link rel="stylesheet" href="../css/humanly.css" />
    <link rel="stylesheet" href="../css/components.css" />

    <!-- Auth Guard (Redirects to dashboard or admin-dashboard if already logged in) -->
    <script src="../js/auth-guard.js"></script>
  </head>
  <body>
    <!-- Full Viewport Responsive Authentication Screen -->
    <div class="auth-page-root">
      
      <!-- Ambient Blurred Glow Elements (Subtle, Deep, Zero Eye Strain) -->
      <div class="auth-bg-ambient" aria-hidden="true">
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
        <div class="glow-orb glow-orb-3"></div>
      </div>

      <!-- Beautiful Glassmorphism Authentication Card -->
      <div class="auth-glass-card">
        
        <!-- Humanly Brand Header -->
        <div class="auth-glass-brand">
          <div class="auth-glass-icon">
            <i class="fa-solid fa-users-viewfinder"></i>
          </div>
          <h2 class="auth-glass-title" id="authFormTitle">HUMANLY</h2>
          <p class="auth-glass-subtitle" id="authFormSubtitle">
            Enterprise People Analytics, Engagement & Culture Platform
          </p>
        </div>

        <!-- 1. SIGN IN FORM -->
        <form id="loginForm">
          <div class="auth-form-group" style="margin-bottom: 1.15rem;">
            <label class="auth-label" for="loginEmail" style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 0.45rem;">
              Work Email Address
            </label>
            <div class="auth-input-wrapper" style="position: relative;">
              <i class="fa-regular fa-envelope input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none;"></i>
              <input
                type="email"
                id="loginEmail"
                class="glass-input"
                required
                placeholder="name@humanly.io"
                value="admin@humanly.io"
              />
            </div>
          </div>

          <div class="auth-form-group" style="margin-bottom: 1.15rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
              <label class="auth-label" for="loginPassword" style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);">
                Password
              </label>
              <a href="#" id="forgotPwLink" style="font-size: 0.76rem; color: var(--primary); text-decoration: none; font-weight: 500;">Forgot password?</a>
            </div>
            <div class="auth-input-wrapper" style="position: relative;">
              <i class="fa-solid fa-lock input-icon" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none;"></i>
              <input
                type="password"
                id="loginPassword"
                class="glass-input"
                required
                value="Admin@2026!"
                placeholder="Enter account password"
                style="padding-right: 2.75rem;"
              />
              <span id="togglePasswordBtn" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; padding: 0.25rem;">
                <i class="fa-solid fa-eye"></i>
              </span>
            </div>
          </div>

          <div id="loginErrorAlert" style="display: none; padding: 0.7rem 0.9rem; background: rgba(185, 28, 28, 0.16); border: 1px solid var(--danger); border-radius: var(--radius-md); color: #fca5a5; font-size: 0.78rem; margin-bottom: 1.15rem;">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="loginErrorMsg">Invalid credentials.</span>
          </div>

          <button
            type="submit"
            id="loginSubmitBtn"
            class="btn btn-primary"
            style="width: 100%; padding: 0.75rem; font-size: 0.92rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border-radius: var(--radius-md); box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);"
          >
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Portal
          </button>
        </form>

        <!-- Pre-Seeded Database Accounts Drawer for Quick Testing -->
        <div class="glass-seeded-drawer">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.65rem;">
            <span style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem;">
              <i class="fa-solid fa-database" style="color: var(--primary);"></i> Seeded Database Accounts
            </span>
            <span class="card-badge" style="font-size: 0.62rem; padding: 0.15rem 0.45rem;">Click to Autofill</span>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;" class="grid-cols-2">
            <!-- Admin Persona Fill -->
            <button
              type="button"
              class="glass-seed-btn"
              id="fillAdminBtn"
            >
              <span style="font-size: 0.74rem; font-weight: 700; color: var(--danger); display: flex; align-items: center; gap: 0.3rem;">
                <i class="fa-solid fa-shield-halved"></i> Administrator
              </span>
              <span style="font-size: 0.68rem; color: var(--text-muted); margin-top: 0.15rem;">admin@humanly.io</span>
            </button>

            <!-- Employee Persona Fill -->
            <button
              type="button"
              class="glass-seed-btn"
              id="fillEmpBtn"
            >
              <span style="font-size: 0.74rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 0.3rem;">
                <i class="fa-solid fa-user"></i> Employee
              </span>
              <span style="font-size: 0.68rem; color: var(--text-muted); margin-top: 0.15rem;">alex.vance@humanly.io</span>
            </button>
          </div>
        </div>

        <!-- Security Badge -->
        <div style="text-align: center; margin-top: 1.15rem; font-size: 0.72rem; color: var(--text-muted);">
          <i class="fa-solid fa-shield-halved" style="color: var(--success);"></i> Enterprise Database PBKDF2/SHA-512 Security
        </div>

      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const loginForm = document.getElementById("loginForm");
        const loginErrorAlert = document.getElementById("loginErrorAlert");
        const loginErrorMsg = document.getElementById("loginErrorMsg");

        // Seed Fill Buttons
        document.getElementById("fillAdminBtn")?.addEventListener("click", () => {
          document.getElementById("loginEmail").value = "admin@humanly.io";
          document.getElementById("loginPassword").value = "Admin@2026!";
          App.showToast("Credentials Loaded", "Loaded Administrator account (admin@humanly.io)", "info");
        });

        document.getElementById("fillEmpBtn")?.addEventListener("click", () => {
          document.getElementById("loginEmail").value = "alex.vance@humanly.io";
          document.getElementById("loginPassword").value = "Employee@2026!";
          App.showToast("Credentials Loaded", "Loaded Employee account (alex.vance@humanly.io)", "info");
        });

        // Eye Password Toggle
        const toggleBtn = document.getElementById("togglePasswordBtn");
        const passInput = document.getElementById("loginPassword");
        toggleBtn?.addEventListener("click", () => {
          const isPass = passInput.getAttribute("type") === "password";
          passInput.setAttribute("type", isPass ? "text" : "password");
          toggleBtn.innerHTML = isPass ? '<i class="fa-solid fa-eye-slash"></i>' : '<i class="fa-solid fa-eye"></i>';
        });

        // Initialize Theme from localStorage (defaults to dark mode)
        const savedTheme = localStorage.getItem("humanly_theme") || localStorage.getItem("adminator_theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);

        // Login Submission
        loginForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          const password = document.getElementById("loginPassword").value;
          const submitBtn = document.getElementById("loginSubmitBtn");

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
          loginErrorAlert.style.display = "none";

          try {
            await AuthGuard.loginWithCredentials(email, password);
          } catch (err) {
            loginErrorAlert.style.display = "block";
            loginErrorMsg.textContent = err.message || "Invalid credentials.";
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Portal';
          }
        });

        document.getElementById("forgotPwLink")?.addEventListener("click", (e) => {
          e.preventDefault();
          alert("A temporary reset token has been dispatched to your corporate inbox.");
        });
      });
    </script>
  </body>
</html>
